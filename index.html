<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tax Calculator</title>
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
    <script src="taxCalculator.js" defer></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="calculator">
      <h1>Tax Calculator</h1>
      <p>Estimate your tax and take-home income.</p>
      <form id="tax-form">
        <label for="income">Annual income</label>
        <div class="input-row">
          <span aria-hidden="true">$</span>
          <input id="income" name="income" type="number" min="0" step="0.01" required>
        </div>
        <button type="submit">Calculate</button>
      </form>
      <p id="message" role="status" aria-live="polite"></p>
      <dl id="results" hidden>
        <div><dt>Estimated tax</dt><dd id="tax-result"></dd></div>
        <div><dt>Net income</dt><dd id="net-result"></dd></div>
      </dl>
    </main>
  </body>
</html>
